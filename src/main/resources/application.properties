spring.application.name=kvarteri

# Database: credentials come from the environment, never commit real values.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kvarteri}
spring.datasource.username=${DB_USER:kvarteri}
spring.datasource.password=${DB_PASSWORD:}
# Use "validate" in production with proper migrations (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# Do not expose stack traces/messages in error responses.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
