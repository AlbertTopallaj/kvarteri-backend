spring.application.name=kvarteri

# Database: credentials come from the environment, never commit real values.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kvarteri}
spring.datasource.username=${DB_USER:kvarteri}
spring.datasource.password=${DB_PASSWORD:}
# Schema is managed by Flyway (src/main/resources/db/migration); Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false

# Do not expose stack traces/messages in error responses.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# First admin account (created on startup if missing). Set via env, min 10 chars password.
kvarteri.admin.email=${KVARTERI_ADMIN_EMAIL:}
kvarteri.admin.password=${KVARTERI_ADMIN_PASSWORD:}
