services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-kvarteri}
      POSTGRES_USER: ${DB_USER:-kvarteri}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # No published port: the database is only reachable from the app container.

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-kvarteri}
      DB_USER: ${DB_USER:-kvarteri}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      KVARTERI_ADMIN_EMAIL: ${KVARTERI_ADMIN_EMAIL:-}
      KVARTERI_ADMIN_PASSWORD: ${KVARTERI_ADMIN_PASSWORD:-}
    ports:
      # Bound to localhost; put a TLS-terminating reverse proxy in front for real use (HTTP Basic!).
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
